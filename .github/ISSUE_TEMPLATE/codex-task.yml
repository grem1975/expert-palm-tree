name: Codex task
description: A scoped engineering task for Codex
title: "[Codex] "
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the measurable outcome.
      placeholder: What should be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include only the repository context needed for this task.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: State what must not change and any approval boundaries.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide a checklist of observable completion criteria.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List expected tests, checks, or manual verification.
    validations:
      required: true
